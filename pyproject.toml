[project]
name = "vn-culture-image-retrieval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-settings>=2.4", "fastapi", "uvicorn", "aiohttp", "tenacity", "pandas", "pyarrow",
  "openpyxl", "numpy", "Pillow", "rapidfuzz", "boto3", "qdrant-client", "huggingface_hub",
]

[project.optional-dependencies]
ml = ["transformers", "FlagEmbedding", "sentencepiece", "protobuf", "accelerate"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx", "moto[s3]"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: needs real models or a running Qdrant",
  "integration: needs network or external services",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
