name: Deploy

# Chỉ chạy khi đã cấu hình VPS: đặt biến repo DEPLOY_ENABLED=true và VPS_FINGERPRINT (SHA256 của khoá máy chủ), cùng các secrets
# VPS_HOST, VPS_USER, VPS_SSH_KEY. Dùng khoá SSH riêng cho CD (không dùng khoá cá nhân) và cổng 22 của VPS phải cho GitHub truy cập.
# VPS_FINGERPRINT phải là vân tay **ECDSA** của máy chủ (thư viện SSH của action chọn ECDSA; ED25519 làm bước kết nối báo mismatch):
#   ssh-keygen -lf /etc/ssh/ssh_host_ecdsa_key.pub
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false  # không chạy chồng hai lần deploy

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra VPS có bật không
        id: up
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if timeout 10 bash -c "</dev/tcp/$HOST/22" 2>/dev/null; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VPS không phản hồi cổng 22 (máy đang tắt?): bỏ qua deploy"
          fi
      - name: Cập nhật và khởi động lại trên VPS
        if: steps.up.outputs.up == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_FINGERPRINT }}  # chống giả mạo máy chủ
          command_timeout: 20m  # build image trên VPS có thể lâu hơn mặc định 10 phút
          script_stop: true
          script: |
            cd ~/vn-culture-image-retrieval
            git pull --ff-only
            bash deploy/deploy.sh
