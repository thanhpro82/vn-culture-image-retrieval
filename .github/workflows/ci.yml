name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài phụ thuộc nhẹ (không cần torch cho test nhanh)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval loadtest
      - name: Test nhanh (bỏ test cần model hoặc mạng)
        run: pytest -m "not slow and not integration" -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Kiểm tra compose
        run: docker compose config -q
      - name: Build image api (cache theo layer)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vn-culture-image-retrieval:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Kích thước image
        run: docker image ls vn-culture-image-retrieval:ci
