<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt bộ test</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #fff; --ink: #1d2433; --muted: #5d6679; --line: #d9d6cc;
  --accent: #2a5d9f; --accent-soft: #e1ebf7;
  --ok: #2f7d4f; --ok-soft: #e0f0e6; --bad: #b4432c; --bad-soft: #f3e3de; --amb: #9a6a00; --amb-soft: #f7ecce;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171f; --panel: #1d222d; --ink: #e8e9ee; --muted: #9aa3b5; --line: #323a4a;
    --accent: #7fb0ec; --accent-soft: #1f2e45;
    --ok: #6dc896; --ok-soft: #1b3326; --bad: #ef8a73; --bad-soft: #3a2420; --amb: #e5b94f; --amb-soft: #38301a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 1.05rem; margin: 0; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1 1 160px; min-width: 120px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
input[type=text], textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input[type=text] { width: 190px; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
main { display: grid; grid-template-columns: 1fr 260px; gap: 16px; padding: 16px; max-width: 1180px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.q { font-size: clamp(1.3rem, 2.6vw, 1.9rem); font-weight: 700; margin: 8px 0 12px; line-height: 1.25; }
.gold { display: grid; gap: 8px; margin-bottom: 14px; }
.gold div { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: .98rem; }
.gold small { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 2px; }
.verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.verdicts button { padding: 14px 8px; font-weight: 700; font-size: 1rem; }
.verdicts kbd { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
.v-dung.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.v-sai.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.v-mo_ho.on { background: var(--amb-soft); border-color: var(--amb); color: var(--amb); }
.nav { display: flex; justify-content: space-between; margin-top: 12px; }
aside { display: grid; gap: 6px; align-content: start; max-height: calc(100vh - 110px); overflow: auto; position: sticky; top: 76px; }
aside button { text-align: left; padding: 6px 10px; font-size: .88rem; display: flex; gap: 8px; align-items: center; }
aside button.cur { border-color: var(--accent); background: var(--accent-soft); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.dot.dung { background: var(--ok); } .dot.sai { background: var(--bad); } .dot.mo_ho { background: var(--amb); }
aside span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { color: var(--muted); font-size: .85rem; }
.toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; display: none; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: 220px; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Duyệt bộ test</h1>
    <input type="text" id="reviewer" placeholder="Tên người duyệt" aria-label="Tên người duyệt">
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <span id="count" class="hint"></span>
    <button id="export" type="button">Xuất CSV</button>
  </div>
  <div class="row" style="margin-top:8px" id="filters" role="group" aria-label="Lọc"></div>
</header>
<main>
  <section class="card" id="card" aria-live="polite"></section>
  <aside id="list" aria-label="Danh sách truy vấn"></aside>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  var ROWS = /*__DATA__*/[];
  var KEY = "review-v1-" + ROWS.map(function (r) { return r.id; }).join(",").length + "-" + (ROWS[0] ? ROWS[0].id : "");
  var LABEL = { dung: "Đúng", sai: "Sai", mo_ho: "Mơ hồ" };
  var state = { verdict: {}, note: {}, reviewer: "" };
  var filter = "all", cur = 0;

  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) { state = saved; } } catch (e) { /* không có localStorage: vẫn dùng được, chỉ không tự lưu */ }
  ROWS.forEach(function (r) { if (r.verdict && !state.verdict[r.id]) { state.verdict[r.id] = r.verdict; } if (r.note && !state.note[r.id]) { state.note[r.id] = r.note; } });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* bỏ qua */ } }
  function $(id) { return document.getElementById(id); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = "none"; }, 2200); }
  function visible() { return ROWS.filter(function (r) { return filter === "all" || (filter === "todo" ? !state.verdict[r.id] : r.type === filter); }); }
  function done() { return ROWS.filter(function (r) { return state.verdict[r.id]; }).length; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text !== undefined) { e.textContent = text; } return e; }

  function renderFilters() {
    var box = $("filters"); box.textContent = "";
    [["all", "Tất cả"], ["todo", "Chưa duyệt"], ["single", "single"], ["multi_intent", "multi_intent"], ["multi_hop", "multi_hop"]].forEach(function (f) {
      var b = el("button", "chip" + (filter === f[0] ? " on" : ""), f[1]); b.type = "button";
      b.addEventListener("click", function () { filter = f[0]; cur = 0; render(); });
      box.appendChild(b);
    });
  }

  function renderCard() {
    var vis = visible(), card = $("card"); card.textContent = "";
    if (!vis.length) { card.appendChild(el("p", "hint", "Không có truy vấn nào trong bộ lọc này.")); return; }
    if (cur >= vis.length) { cur = vis.length - 1; }
    var r = vis[cur];
    card.appendChild(el("span", "tag", r.type + "  ·  " + r.id));
    card.appendChild(el("div", "q", r.query));
    var gold = el("div", "gold");
    r.gold.split(" | ").forEach(function (part) {
      var m = part.match(/^([^\[]+)\[([^\]]*)\]:\s*(.*)$/), d = el("div");
      if (m) { d.appendChild(el("small", "", m[1].trim() + " · " + m[2])); d.appendChild(document.createTextNode(m[3])); }
      else { d.textContent = part; }
      gold.appendChild(d);
    });
    card.appendChild(gold);
    var vb = el("div", "verdicts");
    [["dung", "1"], ["sai", "2"], ["mo_ho", "3"]].forEach(function (v) {
      var b = el("button", "v-" + v[0] + (state.verdict[r.id] === v[0] ? " on" : ""), LABEL[v[0]]); b.type = "button";
      b.appendChild(el("kbd", "", "phím " + v[1]));
      b.addEventListener("click", function () { setVerdict(r.id, v[0]); });
      vb.appendChild(b);
    });
    card.appendChild(vb);
    var ta = el("textarea"); ta.id = "note"; ta.placeholder = "Ghi chú (bắt buộc nghĩ tới khi chọn Sai hoặc Mơ hồ). Phím N để gõ, Esc để thoát."; ta.value = state.note[r.id] || "";
    ta.addEventListener("input", function () { state.note[r.id] = ta.value; save(); });
    card.appendChild(ta);
    var nav = el("div", "nav"), prev = el("button", "", "← Trước"), next = el("button", "", "Sau →");
    prev.type = next.type = "button";
    prev.addEventListener("click", function () { go(-1); }); next.addEventListener("click", function () { go(1); });
    nav.appendChild(prev); nav.appendChild(el("span", "hint", (cur + 1) + " / " + vis.length)); nav.appendChild(next);
    card.appendChild(nav);
  }

  function renderList() {
    var box = $("list"); box.textContent = "";
    var vis = visible();
    vis.forEach(function (r, i) {
      var b = el("button", i === cur ? "cur" : ""); b.type = "button";
      b.appendChild(el("span", "dot " + (state.verdict[r.id] || "")));
      b.appendChild(el("span", "t", r.query));
      b.addEventListener("click", function () { cur = i; render(); });
      box.appendChild(b);
    });
  }

  function renderHead() {
    var n = done(); $("count").textContent = n + " / " + ROWS.length + " đã duyệt";
    $("prog").style.width = (ROWS.length ? 100 * n / ROWS.length : 0) + "%";
    $("reviewer").value = state.reviewer || "";
  }

  function render() { renderFilters(); renderCard(); renderList(); renderHead(); }

  function setVerdict(id, v) {
    state.verdict[id] = state.verdict[id] === v ? "" : v; save();
    if (state.verdict[id]) {
      var vis = visible(), i = vis.findIndex(function (r) { return r.id === id; });
      if (filter === "todo") { render(); return; }
      if (i >= 0 && i < vis.length - 1) { cur = i + 1; }
    }
    render();
  }
  function go(d) { var n = visible().length; cur = Math.max(0, Math.min(n - 1, cur + d)); render(); }

  function csvCell(s) { s = String(s == null ? "" : s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function exportCsv() {
    var left = ROWS.length - done();
    var head = ["id", "type", "query", "gold", "verdict", "note", "reviewer"];
    var lines = [head.join(",")].concat(ROWS.map(function (r) {
      return [r.id, r.type, r.query, r.gold, state.verdict[r.id] || "", state.note[r.id] || "", state.reviewer || ""].map(csvCell).join(",");
    }));
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "review-done-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    toast(left ? "Đã xuất. Còn " + left + " truy vấn chưa duyệt." : "Đã xuất đủ " + ROWS.length + " truy vấn.");
  }

  $("export").addEventListener("click", exportCsv);
  $("reviewer").addEventListener("input", function (e) { state.reviewer = e.target.value; save(); });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "TEXTAREA" || tag === "INPUT") { if (e.key === "Escape") { e.target.blur(); } return; }
    var vis = visible(); if (!vis.length) { return; }
    var r = vis[cur];
    if (e.key === "1") { setVerdict(r.id, "dung"); } else if (e.key === "2") { setVerdict(r.id, "sai"); } else if (e.key === "3") { setVerdict(r.id, "mo_ho"); }
    else if (e.key === "ArrowRight") { go(1); } else if (e.key === "ArrowLeft") { go(-1); }
    else if (e.key === "n" || e.key === "N") { e.preventDefault(); var t = $("note"); if (t) { t.focus(); } }
  });
  window.__review = { state: function () { return state; }, rows: ROWS };
  render();
})();
</script>
</body>
</html>
